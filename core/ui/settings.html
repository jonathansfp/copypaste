<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CopyPaste — Configurações</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { display: flex; background: var(--bg); }
    aside { width: 196px; flex: none; padding: 18px 10px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
    aside .brand { display: flex; align-items: center; gap: 9px; padding: 0 10px 16px; font-weight: 700; font-size: 16px; }
    aside .brand img { width: 30px; height: 30px; }
    aside button { display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; color: var(--muted); font-weight: 500; }
    aside button:hover { color: var(--text); }
    aside button.active { background: var(--accent-soft); color: var(--accent); }
    main { flex: 1; overflow-y: auto; padding: 26px 30px 40px; }
    h1 { font-size: 21px; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 20px; }
    section { display: none; }
    section.active { display: block; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; margin-bottom: 16px; }
    .card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 4px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-top: 1px solid var(--line); }
    .row:first-of-type, h3 + .row { border-top: 0; }
    .row .l { flex: 1; min-width: 0; }
    .row .l small { display: block; color: var(--muted); font-size: 12px; }
    .err { color: var(--danger); font-size: 12px; display: block; }
    .hk { min-width: 150px; justify-content: center; font-family: var(--font); }
    .hk.rec { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    select, input[type=number], input[type=text] { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
    .path { flex: 1; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .switch { position: relative; width: 40px; height: 23px; flex: none; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .15s; cursor: pointer; }
    .switch span::after { content: ""; position: absolute; width: 17px; height: 17px; left: 3px; top: 3px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
    .switch input:checked + span { background: var(--accent); }
    .switch input:checked + span::after { transform: translateX(17px); }
    .note { padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); margin: 10px 0; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .feat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
    .feat b { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .feat p { margin: 0; color: var(--muted); font-size: 13px; }
    .pix { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .pix code { flex: 1; min-width: 0; padding: 10px 12px; border-radius: 9px; background: var(--bg); border: 1px dashed var(--line); font: 600 13px "Cascadia Code", Consolas, monospace; word-break: break-all; user-select: all; }
    .heart { color: #ff4d6d; }
    table.keys { width: 100%; border-collapse: collapse; }
    table.keys td { padding: 6px 0; border-top: 1px solid var(--line); }
    table.keys td:first-child { width: 46%; }
  </style>
</head>
<body>
  <aside id="nav">
    <div class="brand"><img src="icon.png" alt="">CopyPaste</div>
  </aside>
  <main id="main"></main>
  <script type="module" src="js/settings.js"></script>
</body>
</html>
