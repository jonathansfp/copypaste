<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="css/app.css">
  <style>
    html, body { background: transparent; overflow: hidden; margin: 0; }
    body { display: grid; place-items: center; height: 100vh; }
    .pill {
      display: flex; align-items: center; gap: 10px; width: 344px; height: 56px; box-sizing: border-box; padding: 0 10px;
      border-radius: 99px; background: rgba(18, 18, 22, 0.92); border: 1px solid rgba(255, 255, 255, 0.12); color: #fff;
    }
    button { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: #fff; }
    #cancel { background: rgba(255, 255, 255, 0.13); }
    #done { background: var(--accent, #3b82f6); }
    .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
    .bars { display: flex; align-items: center; gap: 3px; height: 24px; }
    .bars i { width: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.9); height: 4px; transition: height .08s; }
    .hint { font-size: 11px; color: rgba(255, 255, 255, 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .busy { display: none; align-items: center; gap: 9px; font-size: 13px; font-weight: 500; }
    .spin { width: 15px; height: 15px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .25); border-top-color: #fff; animation: r .8s linear infinite; }
    @keyframes r { to { transform: rotate(1turn); } }
    .processing .bars, .processing .hint, .processing #done { display: none; }
    .processing .busy { display: flex; }
  </style>
</head>
<body>
  <div class="pill" id="pill">
    <button id="cancel" title="Cancelar">
      <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="mid">
      <div class="bars" id="bars"></div>
      <div class="hint" id="hint">Ouvindo…</div>
      <div class="busy"><span class="spin"></span><span id="what">Transcrevendo…</span></div>
    </div>
    <button id="done" title="Terminar">
      <svg width="13" height="13" viewBox="0 0 14 14"><path d="M2.5 7.5l3 3 6-7" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <script>
    const T = window.__TAURI__;
    const bars = document.getElementById('bars');
    const N = 26;
    for (let i = 0; i < N; i++) bars.append(document.createElement('i'));
    const levels = new Array(N).fill(0);
    const pretty = a => (a || 'o atalho').split('+').map(k => ({ Super: 'Win', Space: 'Espaço', Control: 'Ctrl' }[k] || k)).join('+');
    T.event.listen('dict-level', e => {
      levels.shift(); levels.push(e.payload);
      [...bars.children].forEach((el, i) => { el.style.height = (4 + levels[i] * 20) + 'px'; });
    });
    T.event.listen('dict-state', e => {
      const s = e.payload;
      const pill = document.getElementById('pill');
      pill.classList.toggle('processing', s.phase === 'processing');
      if (s.phase === 'listening') {
        levels.fill(0);
        [...bars.children].forEach(el => { el.style.height = '4px'; });
        const k = pretty(s.key);
        document.getElementById('hint').textContent = s.command
          ? (s.handsFree ? `Diga o que fazer · ${k} termina` : 'Diga o que fazer com o texto selecionado')
          : (s.handsFree ? `Ouvindo · ${k} termina` : 'Ouvindo · solte para terminar');
      } else {
        document.getElementById('what').textContent = s.text;
      }
    });
    document.getElementById('cancel').onclick = () => T.core.invoke('dictation_cancel');
    document.getElementById('done').onclick = () => T.core.invoke('dictation_finish');
  </script>
</body>
</html>
