<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CopyPaste</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { background: var(--panel); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 0; user-select: none; }
    header { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
    .search { flex: 1; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--bg); color: var(--muted); }
    .search input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px; }
    .icon-btn { border: 0; background: transparent; color: var(--muted); width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
    .icon-btn:hover { background: var(--bg); color: var(--text); }
    nav { display: flex; gap: 4px; padding: 0 14px 8px; overflow-x: auto; }
    nav button { border: 0; padding: 4px 11px; border-radius: 999px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 500; white-space: nowrap; }
    nav button.active { background: var(--accent-soft); color: var(--accent); }
    main { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
    .item { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; cursor: default; min-height: 44px; }
    .item.sel { background: var(--accent); color: #fff; }
    .item.sel .meta, .item.sel .kind { color: rgba(255, 255, 255, 0.85); }
    .kind { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--bg); color: var(--muted); }
    .item.sel .kind { background: rgba(255, 255, 255, 0.18); }
    .thumb { width: 48px; height: 34px; border-radius: 6px; object-fit: cover; flex: none; background: var(--bg); }
    .swatch { width: 30px; height: 30px; border-radius: 8px; flex: none; box-shadow: 0 0 0 1px var(--line) inset; }
    .body { flex: 1; min-width: 0; }
    .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .title.code { font-family: "Cascadia Code", Consolas, "DejaVu Sans Mono", monospace; font-size: 12.5px; }
    .meta { font-size: 11.5px; color: var(--muted); }
    .num { font-size: 11px; color: var(--muted); width: 18px; text-align: right; flex: none; }
    .item.sel .num { color: rgba(255, 255, 255, 0.8); }
    .pinmark { color: #f5a524; flex: none; }
    .empty { text-align: center; color: var(--muted); padding: 60px 20px; }
    footer { display: flex; gap: 14px; align-items: center; padding: 7px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    footer .sp { flex: 1; }
    #preview { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: grid; place-items: center; padding: 26px; z-index: 5; }
    #preview .box { max-width: 100%; max-height: 100%; overflow: auto; background: var(--panel); border-radius: 12px; padding: 14px; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
    #preview img { max-width: 100%; max-height: 420px; display: block; }
  </style>
</head>
<body>
  <header>
    <div class="search" id="searchbox"></div>
    <button class="icon-btn" id="settings" title="Configurações"></button>
  </header>
  <nav id="filters"></nav>
  <main id="list"></main>
  <footer>
    <span><kbd>↵</kbd> colar</span><span><kbd>Ctrl</kbd>+<kbd>↵</kbd> só copiar</span><span><kbd>Espaço</kbd> ver</span><span><kbd>Ctrl</kbd>+<kbd>P</kbd> fixar</span><span><kbd>Del</kbd> excluir</span>
    <span class="sp"></span><span id="count"></span>
  </footer>
  <div id="preview" hidden><div class="box" id="pvbox"></div></div>
  <script type="module" src="js/history.js"></script>
</body>
</html>
