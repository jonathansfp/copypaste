[package]
name = "copypaste"
description = "Histórico de cópias, captura de tela com anotações, quadro de apresentação e gravação de tela"
license = "GPL-3.0"
default-run = "copypaste"
version = "1.1.0"
edition = "2021"

[lib]
name = "copypaste_lib"
path = "src/lib.rs"

[dependencies]
arboard = "3.7.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
tauri = { version = "2.12.7", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
uuid = { version = "1.29.3", features = ["v4"] }
xcap = "0.9.10"

[build-dependencies]
tauri-build = "2.7.6"

[target.'cfg(windows)'.dependencies]
copypaste-windows = { path = "../../windows" }

[target.'cfg(target_os = "linux")'.dependencies]
copypaste-linux = { path = "../../linux" }
arboard = { version = "3.7.0", features = ["wayland-data-control"] }
