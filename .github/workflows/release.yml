# Builds CopyPaste for Windows, Linux and macOS and publishes the installers on the Releases page.
# Runs when a version tag (v1.2.0, for example) is pushed, or by hand from the "Actions" tab.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: core
        run: |
          npm ci
          npx tauri build
      - name: Gather files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem target/release/bundle/nsis/*.exe | Select-Object -First 1) out/CopyPaste-Windows-Setup.exe
          Copy-Item (Get-ChildItem target/release/bundle/msi/*.msi | Select-Object -First 1) out/CopyPaste-Windows.msi
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item target/release/copypaste.exe portable/CopyPaste.exe
          Compress-Archive -Path portable/* -DestinationPath out/CopyPaste-Windows-Portable.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libxdo-dev libxcb1-dev libxcb-randr0-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev \
            libwayland-dev libegl1-mesa-dev libgbm-dev libdrm-dev clang libclang-dev libssl-dev libasound2-dev build-essential file rpm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: core
        run: |
          npm ci
          npx tauri build
      - name: Gather files
        run: |
          mkdir -p out
          cp target/release/bundle/appimage/*.AppImage out/CopyPaste-Linux-x86_64.AppImage
          cp target/release/bundle/deb/*.deb out/CopyPaste-Linux-amd64.deb
          cp target/release/bundle/rpm/*.rpm out/CopyPaste-Linux-x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: macos
        run: ./package.sh
      - name: Gather files
        run: |
          mkdir -p out
          cp macos/dist/*.dmg out/CopyPaste-macOS.dmg
          cp macos/dist/*.zip out/CopyPaste-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  release:
    name: Publish
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Sistema | Arquivo |
            |---|---|
            | 🪟 Windows 10/11 (instalador) | **CopyPaste-Windows-Setup.exe** |
            | 🪟 Windows (MSI, para empresas) | CopyPaste-Windows.msi |
            | 🪟 Windows (portátil, sem instalar) | CopyPaste-Windows-Portable.zip |
            | 🐧 Linux (qualquer distro) | **CopyPaste-Linux-x86_64.AppImage** |
            | 🐧 Ubuntu / Debian / Mint | CopyPaste-Linux-amd64.deb |
            | 🐧 Fedora / openSUSE | CopyPaste-Linux-x86_64.rpm |
            | 🍎 macOS 14+ (Apple Silicon e Intel) | **CopyPaste-macOS.dmg** |

            💚 Gostou? Apoie com um Pix: `586cb2d1-8a6e-4bed-8cdb-1f413e8f3e38`
